.tb.icon{width:34px;padding:0;justify-content:center}
.thumb{border-radius:8px;overflow:hidden;background:rgba(255,255,255,.07);aspect-ratio:1;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ring{box-shadow:inset 0 0 0 2px #0A84FF}
