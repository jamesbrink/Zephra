name: Zephra
options:
  bundleIdPrefix: io.zephra
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.45.0"
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "YES"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    CODE_SIGN_STYLE: Automatic
    # Both configurations sign ad-hoc, so `make build` works on a machine with no
    # certificate at all. Distribution signing is the Makefile's job: `make release`
    # re-signs the Release bundle with the Developer ID identity, a secure
    # timestamp, and the hardened runtime.
    CODE_SIGN_IDENTITY: "-"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      MTL_ENABLE_DEBUG_INFO: "NO"
      MTL_FAST_MATH: "YES"
      ENABLE_TESTABILITY: "NO"

packages:
  ZephraKit:
    path: Packages/ZephraKit
  ZephraMLXKit:
    path: Packages/ZephraMLXKit
  ZephraBackendZImage:
    path: Packages/ZephraBackendZImage
  ZephraBackendQwenImage:
    path: Packages/ZephraBackendQwenImage
  QwenImageKit:
    path: Packages/QwenImageKit
  ZImageKit:
    path: Packages/ZImageKit

targets:
  Zephra:
    type: application
    platform: macOS
    sources:
      - path: Sources/Zephra
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: ZephraKit
        product: ZephraCore
      - package: ZephraKit
        product: ZephraEngine
      - package: ZephraBackendZImage
        product: ZephraBackendZImage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zephra.Zephra
        PRODUCT_NAME: Zephra
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Sources/Zephra/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"

  ZephraBench:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ZephraBench
    dependencies:
      - package: ZephraKit
        product: ZephraCore
      - package: ZephraBackendZImage
        product: ZephraBackendZImage
      - package: ZephraBackendQwenImage
        product: ZephraBackendQwenImage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zephra.ZephraBench
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  ZephraQuantize:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ZephraQuantize
    dependencies:
      - package: ZephraKit
        product: ZephraCore
      - package: ZephraMLXKit
        product: ZephraQuantization
      - package: ZephraBackendZImage
        product: ZephraBackendZImage
      - package: ZephraBackendQwenImage
        product: ZephraBackendQwenImage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zephra.ZephraQuantize
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  Zephra:
    build:
      targets:
        Zephra: all
    run:
      config: Release
      environmentVariables:
        MTL_DEBUG_LAYER: "0"
        MTL_SHADER_VALIDATION: "0"
  ZephraBench:
    build:
      targets:
        ZephraBench: all
    run:
      config: Release
  ZephraQuantize:
    build:
      targets:
        ZephraQuantize: all
    run:
      config: Release
