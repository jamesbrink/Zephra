name: Zephra
options:
  bundleIdPrefix: io.zephra
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.45.0"
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "YES"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    CODE_SIGN_STYLE: Automatic
    # Both configurations sign ad-hoc, so `make build` works on a machine with no
    # certificate at all. Distribution signing is the Makefile's job: `make release`
    # re-signs the Release bundle with the Developer ID identity, a secure
    # timestamp, and the hardened runtime.
    CODE_SIGN_IDENTITY: "-"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      MTL_ENABLE_DEBUG_INFO: "NO"
      MTL_FAST_MATH: "YES"
      ENABLE_TESTABILITY: "NO"

packages:
  ZephraKit:
    path: Packages/ZephraKit
  ZephraStyle:
    path: Packages/ZephraStyle
  ZephraMLXKit:
    path: Packages/ZephraMLXKit
  ZephraBackendZImage:
    path: Packages/ZephraBackendZImage
  ZephraBackendQwenImage:
    path: Packages/ZephraBackendQwenImage
  ZephraBackendFlux2:
    path: Packages/ZephraBackendFlux2
  ZephraBackendLTX2:
    path: Packages/ZephraBackendLTX2
  ZephraBackendWan:
    path: Packages/ZephraBackendWan
  ZephraUpscaleRealESRGAN:
    path: Packages/ZephraUpscaleRealESRGAN
  Flux2Kit:
    path: Packages/Flux2Kit
  LTX2Kit:
    path: Packages/LTX2Kit
  WanKit:
    path: Packages/WanKit
  QwenImageKit:
    path: Packages/QwenImageKit
  ZImageKit:
    path: Packages/ZImageKit
  # The wire the Mac and a future iOS app share. No target links it yet.
  ZephraLink:
    path: Packages/ZephraLink

targets:
  Zephra:
    type: application
    platform: macOS
    sources:
      - path: Sources/Zephra
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: ZephraKit
        product: ZephraCore
      - package: ZephraKit
        product: ZephraEngine
      # The chrome: every radius, hairline, wash and colour set, shared with the iOS
      # companion so the two apps are drawn from one set of numbers.
      - package: ZephraStyle
        product: ZephraStyle
      # For `MP4Stitcher`, the one `ClipEditing` the root injects; nothing else in the app
      # target imports ZephraMedia.
      - package: ZephraKit
        product: ZephraMedia
      - package: ZephraBackendZImage
        product: ZephraBackendZImage
      - package: ZephraBackendQwenImage
        product: ZephraBackendQwenImage
      - package: ZephraBackendFlux2
        product: ZephraBackendFlux2
      - package: ZephraBackendLTX2
        product: ZephraBackendLTX2
      - package: ZephraBackendWan
        product: ZephraBackendWan
      - package: ZephraUpscaleRealESRGAN
        product: ZephraUpscaleRealESRGAN
      # Linked by name: SwiftUI's VideoPlayer lives in an AVKit overlay whose superclass is
      # resolved at runtime, and without the framework in the link the first clip on the
      # canvas aborts with "failed to demangle superclass of VideoPlayerView".
      - sdk: AVKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zephra.Zephra
        PRODUCT_NAME: Zephra
        # What an ordinary build is stamped with. A release overrides both on the
        # xcodebuild command line (`make release VERSION=0.2.0 BUILD_NUMBER=42`; the
        # workflow passes its dispatch input and the run number), so a version is never
        # bumped here for a release, only when the default itself should move.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Sources/Zephra/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"

  # The app's own tests, hosted inside the app so they can `@testable import Zephra`. Pure
  # interface logic belongs here: export planning, display strings, layout arithmetic. Debug
  # only, because Release turns ENABLE_TESTABILITY off. `Scratch` comes from ZephraTestSupport.
  ZephraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ZephraTests
    dependencies:
      - target: Zephra
      - package: ZephraKit
        product: ZephraTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zephra.ZephraTests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"

  ZephraBench:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ZephraBench
    dependencies:
      - package: ZephraKit
        product: ZephraCore
      - package: ZephraKit
        product: ZephraSnapshot
      # For `ClipTail` and `MP4Stitcher`, so --extend measures a continuation end to end.
      - package: ZephraKit
        product: ZephraMedia
      - package: ZephraBackendZImage
        product: ZephraBackendZImage
      - package: ZephraBackendQwenImage
        product: ZephraBackendQwenImage
      - package: ZephraBackendFlux2
        product: ZephraBackendFlux2
      - package: ZephraBackendLTX2
        product: ZephraBackendLTX2
      - package: ZephraBackendWan
        product: ZephraBackendWan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zephra.ZephraBench
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  ZephraQuantize:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ZephraQuantize
    dependencies:
      - package: ZephraKit
        product: ZephraCore
      # For stamping a build named for a catalog entry with the provenance the app checks.
      - package: ZephraKit
        product: ZephraSnapshot
      - package: ZephraMLXKit
        product: ZephraQuantization
      - package: ZephraBackendZImage
        product: ZephraBackendZImage
      - package: ZephraBackendQwenImage
        product: ZephraBackendQwenImage
      - package: ZephraBackendFlux2
        product: ZephraBackendFlux2
      - package: ZephraBackendLTX2
        product: ZephraBackendLTX2
      - package: ZephraBackendWan
        product: ZephraBackendWan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zephra.ZephraQuantize
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  Zephra:
    build:
      targets:
        Zephra: all
    run:
      config: Release
      environmentVariables:
        MTL_DEBUG_LAYER: "0"
        MTL_SHADER_VALIDATION: "0"
    test:
      config: Debug
      targets:
        - ZephraTests
      environmentVariables:
        # The host app launches frozen with no model, so no weights load and no MLX limits
        # are set under the tests; see `InterfacePreview`.
        ZEPHRA_PREVIEW_STATE: ready
  ZephraBench:
    build:
      targets:
        ZephraBench: all
    run:
      config: Release
  ZephraQuantize:
    build:
      targets:
        ZephraQuantize: all
    run:
      config: Release
