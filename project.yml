name: Zephra
options:
  bundleIdPrefix: io.zephra
  deploymentTarget:
    macOS: "15.0"
    # The phone. 18.0 is what ZephraKit, ZephraLink and ZephraStyle declare, and what the
    # companion needs: Observation, the modern scene lifecycle, and VisionKit's data scanner.
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.45.0"
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "YES"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    CODE_SIGN_STYLE: Automatic
    # Both configurations sign ad-hoc, so `make build` works on a machine with no
    # certificate at all. Distribution signing is the Makefile's job: `make release`
    # re-signs the Release bundle with the Developer ID identity, a secure
    # timestamp, and the hardened runtime.
    CODE_SIGN_IDENTITY: "-"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      MTL_ENABLE_DEBUG_INFO: "NO"
      MTL_FAST_MATH: "YES"
      ENABLE_TESTABILITY: "NO"

packages:
  ZephraKit:
    path: Packages/ZephraKit
  ZephraStyle:
    path: Packages/ZephraStyle
  ZephraMLXKit:
    path: Packages/ZephraMLXKit
  ZephraBackendZImage:
    path: Packages/ZephraBackendZImage
  ZephraBackendQwenImage:
    path: Packages/ZephraBackendQwenImage
  ZephraBackendFlux2:
    path: Packages/ZephraBackendFlux2
  ZephraBackendLTX2:
    path: Packages/ZephraBackendLTX2
  ZephraBackendWan:
    path: Packages/ZephraBackendWan
  ZephraUpscaleRealESRGAN:
    path: Packages/ZephraUpscaleRealESRGAN
  Flux2Kit:
    path: Packages/Flux2Kit
  LTX2Kit:
    path: Packages/LTX2Kit
  WanKit:
    path: Packages/WanKit
  QwenImageKit:
    path: Packages/QwenImageKit
  ZImageKit:
    path: Packages/ZImageKit
  # The wire the Mac and the phone share; `ZephraMobile` links it.
  ZephraLink:
    path: Packages/ZephraLink

targets:
  Zephra:
    type: application
    platform: macOS
    sources:
      - path: Sources/Zephra
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: ZephraKit
        product: ZephraCore
      - package: ZephraKit
        product: ZephraEngine
      # The Mac's side of the companion link: the sessions a paired phone talks through.
      - package: ZephraKit
        product: ZephraLinkHost
      # The wire both ends speak, for the pairing payload the QR code carries.
      - package: ZephraLink
        product: ZephraLinkProtocol
      # The roads under it: a TCP listener on the local network and the relay's WebSocket.
      - package: ZephraLink
        product: ZephraLinkTransport
      # The chrome: every radius, hairline, wash and colour set, shared with the iOS
      # companion so the two apps are drawn from one set of numbers.
      - package: ZephraStyle
        product: ZephraStyle
      # For `MP4Stitcher`, the one `ClipEditing` the root injects; nothing else in the app
      # target imports ZephraMedia.
      - package: ZephraKit
        product: ZephraMedia
      - package: ZephraBackendZImage
        product: ZephraBackendZImage
      - package: ZephraBackendQwenImage
        product: ZephraBackendQwenImage
      - package: ZephraBackendFlux2
        product: ZephraBackendFlux2
      - package: ZephraBackendLTX2
        product: ZephraBackendLTX2
      - package: ZephraBackendWan
        product: ZephraBackendWan
      - package: ZephraUpscaleRealESRGAN
        product: ZephraUpscaleRealESRGAN
      # Linked by name: SwiftUI's VideoPlayer lives in an AVKit overlay whose superclass is
      # resolved at runtime, and without the framework in the link the first clip on the
      # canvas aborts with "failed to demangle superclass of VideoPlayerView".
      - sdk: AVKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zephra.Zephra
        PRODUCT_NAME: Zephra
        # What an ordinary build is stamped with. A release overrides both on the
        # xcodebuild command line (`make release VERSION=0.2.0 BUILD_NUMBER=42`; the
        # workflow passes its dispatch input and the run number), so a version is never
        # bumped here for a release, only when the default itself should move.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Sources/Zephra/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"

  # The app's own tests, hosted inside the app so they can `@testable import Zephra`. Pure
  # interface logic belongs here: export planning, display strings, layout arithmetic. Debug
  # only, because Release turns ENABLE_TESTABILITY off. `Scratch` comes from ZephraTestSupport.
  ZephraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ZephraTests
    dependencies:
      - target: Zephra
      - package: ZephraKit
        product: ZephraTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zephra.ZephraTests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"

  # The companion on the phone. It links the value layer, the wire and the chrome, and
  # nothing else: no backend, no MLX, no engine of its own. Everything it shows comes over
  # the link from a Mac, which is the whole point of the target.
  ZephraMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/ZephraMobile
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: ZephraKit
        product: ZephraCore
      # The protocol both ends speak: the pairing payload, the state snapshot, the library page.
      - package: ZephraLink
        product: ZephraLinkProtocol
      # The roads under it: Bonjour and TCP on the local network, the relay from anywhere.
      # Linked by name rather than left to the client's own dependency, because the app is
      # what names the relay's URL and hands `NetworkLinkRoads` the device's identity.
      - package: ZephraLink
        product: ZephraLinkTransport
      # `LinkClient`: the one type a view reads the Mac through, and the phone's counterpart
      # to the Mac's `GenerationStore`.
      - package: ZephraLink
        product: ZephraLinkClient
      # The same radii, hairlines and washes the Mac is drawn from, so the two apps look like
      # one program rather than resemble each other.
      - package: ZephraStyle
        product: ZephraStyle
      # A clip fetched from the Mac plays in an AVKit player, a pairing code is read by
      # VisionKit's data scanner, and a picture saved goes to the photo library.
      - sdk: AVKit.framework
      - sdk: VisionKit.framework
      - sdk: Photos.framework
      # `PhotosPicker`, the camera roll door into the reference well. Its own framework, not
      # part of Photos: the picker runs out of process, so the app never asks for a photo
      # permission of its own and only the picture somebody chose crosses.
      - sdk: PhotosUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zephra.ZephraMobile
        PRODUCT_NAME: Zephra
        # The app on the phone is called Zephra, but its *module* is not: the Mac's app target
        # already owns that name, and two modules called Zephra in one project is a trap every
        # `@testable import` would fall into. The bundle is unaffected.
        PRODUCT_MODULE_NAME: ZephraMobile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Sources/ZephraMobile/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        # iOS has no hardened runtime, and an app signed with one is refused by the installer.
        ENABLE_HARDENED_RUNTIME: "NO"
        # The simulator takes the base ad-hoc identity, so `make build-ios` works on a machine
        # with no certificate; a device build needs a real one, which only iphoneos asks for.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 28X9H69QGE
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Development"
      configs:
        # A Release device build is a TestFlight archive, signed by hand with the Apple
        # Distribution identity and the App Store profile `scripts/testflight-signing.sh`
        # installs; a runner has no Apple ID in Xcode and no development certificate, only
        # that identity. Set here, on this target alone, because a command-line override
        # would also land on ZephraStyle's resource bundle, which cannot take a profile.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: "Zephra iOS App Store"

  # The companion's own suites, hosted inside it so they can `@testable import ZephraMobile`.
  # Pure interface logic, like the Mac's: parsing a pairing code, reading the frozen fixture.
  ZephraMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ZephraMobileTests
    dependencies:
      - target: ZephraMobile
      - package: ZephraKit
        product: ZephraTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zephra.ZephraMobileTests
        GENERATE_INFOPLIST_FILE: "YES"
        # Spelled out because the host's product is named for the app, not for the target:
        # XcodeGen's default is `$(TARGET_NAME).app/$(TARGET_NAME)`, which is ZephraMobile,
        # and the bundle on disk is Zephra.app/Zephra. The Mac pair never noticed, its target
        # and its product being the one word.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Zephra.app/Zephra
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"

  ZephraBench:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ZephraBench
    dependencies:
      - package: ZephraKit
        product: ZephraCore
      - package: ZephraKit
        product: ZephraSnapshot
      # For `ClipTail` and `MP4Stitcher`, so --extend measures a continuation end to end.
      - package: ZephraKit
        product: ZephraMedia
      - package: ZephraBackendZImage
        product: ZephraBackendZImage
      - package: ZephraBackendQwenImage
        product: ZephraBackendQwenImage
      - package: ZephraBackendFlux2
        product: ZephraBackendFlux2
      - package: ZephraBackendLTX2
        product: ZephraBackendLTX2
      - package: ZephraBackendWan
        product: ZephraBackendWan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zephra.ZephraBench
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  ZephraQuantize:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ZephraQuantize
    dependencies:
      - package: ZephraKit
        product: ZephraCore
      # For stamping a build named for a catalog entry with the provenance the app checks.
      - package: ZephraKit
        product: ZephraSnapshot
      - package: ZephraMLXKit
        product: ZephraQuantization
      - package: ZephraBackendZImage
        product: ZephraBackendZImage
      - package: ZephraBackendQwenImage
        product: ZephraBackendQwenImage
      - package: ZephraBackendFlux2
        product: ZephraBackendFlux2
      - package: ZephraBackendLTX2
        product: ZephraBackendLTX2
      - package: ZephraBackendWan
        product: ZephraBackendWan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zephra.ZephraQuantize
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  Zephra:
    build:
      targets:
        Zephra: all
    run:
      config: Release
      environmentVariables:
        MTL_DEBUG_LAYER: "0"
        MTL_SHADER_VALIDATION: "0"
    test:
      config: Debug
      targets:
        - ZephraTests
      environmentVariables:
        # The host app launches frozen with no model, so no weights load and no MLX limits
        # are set under the tests; see `InterfacePreview`.
        ZEPHRA_PREVIEW_STATE: ready
  ZephraMobile:
    build:
      targets:
        ZephraMobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZephraMobileTests
      environmentVariables:
        # The host launches frozen, the way the Mac's test host does, so nothing under the
        # tests tries to reach a Mac; see `MobilePreview`.
        ZEPHRA_PREVIEW_STATE: ready
  ZephraBench:
    build:
      targets:
        ZephraBench: all
    run:
      config: Release
  ZephraQuantize:
    build:
      targets:
        ZephraQuantize: all
    run:
      config: Release
