# The site goes out on every push to main that touches it, and by hand from the Actions
# tab. `deploy-website.sh` uploads the static export, invalidates the CloudFront
# distribution and waits for the invalidation, then checks the public pages against the
# export. The OIDC role is the one the release workflow uses; the zephra module in the
# urandom.io Terraform grants it the site bucket and the site distribution's invalidations.
# A push that changes only `release.json` carries `[skip ci]` from `release-commit`, and
# the Download button links the `Zephra-latest.dmg` alias anyway, so a release needs no
# site deploy.
name: Deploy production website
on:
  push:
    branches: [main]
    paths:
      - 'product-mockups/**'
      - 'scripts/deploy-website.sh'
      - 'scripts/verify-website.py'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: zephra-production-website
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product-mockups/package-lock.json
      - run: npm ci
        working-directory: product-mockups
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::042506291754:role/service-role/github-actions-zephra
          aws-region: us-west-2
      - run: make deploy-production WEBSITE_PROFILE=
